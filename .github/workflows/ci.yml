name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

# This job only checks out and builds — no write access needed.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # QA suites (tenant-isolation, rollback) are added from step 0.3/1.2
      # onward and become required checks — see docs/BUILD-STATE.md.

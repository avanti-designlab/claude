name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

# This job only checks out and builds — no write access needed.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The tenant-isolation suite (0.3) needs Postgres and runs in its own
      # job below once migrations exist. Rollback suites arrive at 1.2.
